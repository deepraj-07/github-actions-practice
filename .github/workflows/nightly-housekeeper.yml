name: Nightly Housekeeper

"on":
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Show current date and time
        run: date

      - name: Run cleanup
        run: echo "Running nightly cleanup"

      - name: Complete
        run: echo "Housekeeping complete"
