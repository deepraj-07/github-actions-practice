name: Pipeline Archive

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Choose build mode"
        required: true
        type: choice
        options:
          - quick
          - full
        default: quick

      skip_cache:
        description: "Skip cache"
        required: true
        type: boolean
        default: false


env:
  APP_NAME: react-app


jobs:

  test-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    outputs:
      build_ran: ${{ steps.build-status.outputs.build_ran }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Cache node_modules
        id: cache
        if: ${{ inputs.skip_cache != true }}
        uses: actions/cache@v4
        with:
          path: react-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('react-app/package-lock.json') }}


      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci


      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false


      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: react-app/coverage
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}


      - name: Build application
        id: build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || inputs.build_mode == 'full' }}
        run: |
          npm run build


      - name: Mark build status
        id: build-status
        run: |
          if [ "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.build_mode == 'full' }}" = "true" ]; then
            echo "build_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ran=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Explain skipped build
        if: ${{ steps.build-status.outputs.build_ran == 'false' }}
        run: |
          echo "Build skipped because this is a quick run."


      - name: Upload build artifact
        if: ${{ steps.build-status.outputs.build_ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build-${{ github.sha }}
          path: react-app/build
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}


      - name: Pipeline summary
        run: |
          echo "${{ format(
            'App: {0} | Build mode: {1} | Cache used: {2}',
            env.APP_NAME,
            github.event_name == 'workflow_dispatch' && inputs.build_mode || 'n/a — push',
            steps.cache.outputs.cache-hit == 'true'
          ) }}"


  verify-archive:

    runs-on: ubuntu-latest

    needs: test-build

    if: ${{ always() && needs.test-build.result == 'success' }}

    steps:

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: archive


      - name: Download build artifact
        if: ${{ needs.test-build.outputs.build_ran == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-build-${{ github.sha }}
          path: archive


      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq


      - name: Print downloaded structure
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
          tree -L 2 archive


      - name: Create archive manifest
        run: |
          BUILD_PRESENT="false"

          if [ -d "archive/${{ env.APP_NAME }}-build-${{ github.sha }}" ]; then
            BUILD_PRESENT="true"
          fi

          cat > archive-manifest.json <<EOF
          {
            "app_name": "${{ env.APP_NAME }}",
            "run_number": "${{ github.run_number }}",
            "retention_days": "${{ vars.ARTIFACT_RETENTION_DAYS }}",
            "build_artifact_present": "$BUILD_PRESENT"
          }
          EOF

          echo "Archive manifest:"
          cat archive-manifest.json


      - name: Read manifest with jq
        run: |
          APP_NAME=$(jq -r '.app_name' archive-manifest.json)
          echo "App name from manifest: $APP_NAME"


      - name: Archive verified
        run: |
          echo "Archive verified"