name: On-Call Assistant

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint


  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test


  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build


  analyze:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - build

    if: ${{ failure() }}

    outputs:
      is-recurring: ${{ steps.sensethelog.outputs.is-recurring }}

    steps:
      - name: Analyze with SenseTheLog
        id: sensethelog
        uses: sensethelog/action@v1
        with:
          sensethelog-api-key: ${{ secrets.SENSETHELOG_API_KEY }}

      - name: Print SenseTheLog outputs
        run: |
          echo "Is recurring: ${{ steps.sensethelog.outputs.is-recurring }}"
          echo "Error signature: ${{ steps.sensethelog.outputs.error-signature }}"


  notify-on-recurrence:
    runs-on: ubuntu-latest

    needs: analyze

    if: ${{ needs.analyze.outputs.is-recurring == 'true' }}

    steps:
      - name: Priority recurrence notification
        run: echo "This exact failure has happened before and should be treated as a priority fix rather than re-run and forgotten."